services:
  thati:
    build: .
    image: thati-ai:latest
    ports:
      - "80:8000"
    environment:
      APP_MODE: ${APP_MODE:-mock}
      SQLITE_PATH: /data/thati.db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-60000}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-gemini-3.5-transcribe}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ANALYZE_MAX_CHARS: ${ANALYZE_MAX_CHARS:-8000}
      ANALYZE_RATE_LIMIT: ${ANALYZE_RATE_LIMIT:-30}
      ANALYZE_RATE_WINDOW_SECONDS: ${ANALYZE_RATE_WINDOW_SECONDS:-60}
    volumes:
      - thati-data:/data
    restart: unless-stopped
    init: true

volumes:
  thati-data:
