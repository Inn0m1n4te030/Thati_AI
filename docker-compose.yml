services:
  thati:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_MODE: ${APP_MODE:-mock}
      SQLITE_PATH: /data/thati.db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-gemini-3.5-transcribe}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - thati-data:/data

volumes:
  thati-data:
